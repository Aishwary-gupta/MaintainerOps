[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maintainerops"
version = "0.2.0"
description = "A human-first open-source repository maintenance and explainable triage toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MaintainerOps Contributors" }
]
keywords = ["github", "triage", "maintenance", "open-source", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
pydantic = [
    "pydantic>=2.7.0",
]
ml = [
    "scikit-learn>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
maintainerops = "maintainerops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/maintainerops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
